<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qwen3-TTS Streaming Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: #f5f7fa; color: #333; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { text-align: center; margin-bottom: 6px; font-size: 1.6em; }
  .subtitle { text-align: center; color: #888; margin-bottom: 24px; font-size: 0.9em; }

  .card { background: #fff; border-radius: 12px; padding: 24px;
          box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .card h2 { font-size: 1.1em; margin-bottom: 16px; color: #555; }

  label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.85em; color: #555; }
  textarea, input[type=text], select {
    width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px;
    font-size: 0.95em; transition: border-color 0.2s;
  }
  textarea:focus, input:focus, select:focus { outline: none; border-color: #4a90d9; }
  textarea { resize: vertical; min-height: 80px; }

  .row { display: flex; gap: 12px; margin-bottom: 12px; }
  .row > div { flex: 1; }

  .field { margin-bottom: 12px; }
  .hidden { display: none; }

  .btn-row { display: flex; gap: 12px; margin-top: 16px; }
  button {
    flex: 1; padding: 12px 20px; border: none; border-radius: 8px;
    font-size: 1em; font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .btn-primary { background: #4a90d9; color: #fff; }
  .btn-primary:hover { background: #3a7bc8; }
  .btn-primary:disabled { background: #a0c4e8; cursor: not-allowed; }
  .btn-stop { background: #e74c3c; color: #fff; }
  .btn-stop:hover { background: #c0392b; }
  .btn-secondary { background: #eee; color: #555; }
  .btn-secondary:hover { background: #ddd; }

  .status { margin-top: 12px; padding: 10px 14px; border-radius: 8px;
            font-size: 0.85em; background: #f0f4ff; color: #4a6fa5; min-height: 20px; }
  .status.error { background: #fef0f0; color: #c0392b; }
  .status.success { background: #f0fef0; color: #27ae60; }

  #audio-player { width: 100%; margin-top: 12px; }

  .mode-toggle { display: flex; gap: 0; margin-bottom: 16px; border-radius: 8px; overflow: hidden;
                 border: 1px solid #ddd; }
  .mode-toggle button { flex: 1; border-radius: 0; border: none; padding: 8px;
                         background: #f5f5f5; font-size: 0.85em; }
  .mode-toggle button.active { background: #4a90d9; color: #fff; }

  .log { max-height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.8em;
         background: #1e1e1e; color: #d4d4d4; padding: 10px; border-radius: 8px;
         margin-top: 8px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<div class="container">
  <h1>Qwen3-TTS Streaming Test</h1>
  <p class="subtitle">vllm-omni TTS 스트리밍 음성합성 테스트</p>

  <!-- Input Card -->
  <div class="card">
    <h2>Input</h2>
    <div class="field">
      <label for="text-input">Text to Synthesize</label>
      <textarea id="text-input" placeholder="음성으로 변환할 텍스트를 입력하세요...">안녕하세요. 오늘 날씨가 정말 좋네요. 함께 산책하러 가실래요?</textarea>
    </div>

    <div class="row">
      <div>
        <label for="task-type">Task Type</label>
        <select id="task-type">
          <option value="CustomVoice" selected>CustomVoice</option>
          <option value="VoiceDesign">VoiceDesign</option>
          <option value="Base">Base (Voice Clone)</option>
        </select>
      </div>
      <div>
        <label for="language">Language</label>
        <select id="language">
          <option value="Auto">Auto</option>
          <option value="Chinese">Chinese</option>
          <option value="English">English</option>
          <option value="Japanese">Japanese</option>
          <option value="Korean" selected>Korean</option>
          <option value="German">German</option>
          <option value="French">French</option>
          <option value="Russian">Russian</option>
          <option value="Portuguese">Portuguese</option>
          <option value="Spanish">Spanish</option>
          <option value="Italian">Italian</option>
        </select>
      </div>
    </div>

    <!-- CustomVoice fields -->
    <div id="customvoice-fields">
      <div class="row">
        <div>
          <label for="voice">Voice / Speaker</label>
          <select id="voice">
            <option value="Vivian">Vivian</option>
            <option value="Ryan">Ryan</option>
            <option value="sohee" selected>sohee</option>
          </select>
        </div>
        <div>
          <label for="instructions">Style Instructions <span style="color:#aaa">(optional)</span></label>
          <input type="text" id="instructions" placeholder="e.g., Speak with excitement and warmth">
        </div>
      </div>
    </div>

    <!-- VoiceDesign fields -->
    <div id="voicedesign-fields" class="hidden">
      <div class="field">
        <label for="voice-description">Voice Description <span style="color:#c0392b">*</span></label>
        <textarea id="voice-description" rows="2"
          placeholder="e.g., A deep, calm male voice with a slight British accent, speaking at a moderate pace"></textarea>
      </div>
    </div>

    <!-- Base (voice clone) fields -->
    <div id="base-fields" class="hidden">
      <div class="field">
        <label for="ref-audio-file">Reference Audio File <span style="color:#c0392b">*</span>
          <span style="color:#aaa; font-weight:normal">(1~30s audio, uploaded as base64)</span>
        </label>
        <input type="file" id="ref-audio-file" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a">
        <div id="ref-audio-file-info" style="font-size:0.8em; color:#888; margin-top:4px;"></div>
      </div>
      <div class="field">
        <label for="ref-audio-url">…or Reference Audio URL <span style="color:#aaa">(alternative to file)</span></label>
        <input type="text" id="ref-audio-url" placeholder="https://example.com/reference.wav">
      </div>
      <div class="field">
        <label for="ref-text">Reference Transcript <span style="color:#aaa">(optional, improves quality via ICL)</span></label>
        <input type="text" id="ref-text" placeholder="Transcript of the reference audio">
      </div>
    </div>
  </div>

  <!-- Streaming Mode Card -->
  <div class="card">
    <h2>Streaming Mode</h2>
    <div class="mode-toggle">
      <button id="mode-http" class="active" onclick="setMode('http')">Streaming</button>
      <button id="mode-full" onclick="setMode('full')">Non-streaming</button>
    </div>

    <div class="btn-row">
      <button id="btn-generate" class="btn-primary" onclick="generate()">Generate Speech</button>
      <button id="btn-stop" class="btn-stop hidden" onclick="stopGeneration()">Stop</button>
      <button id="btn-replay" class="btn-secondary hidden" onclick="replay()">Replay</button>
      <button class="btn-secondary" onclick="clearAll()">Clear</button>
    </div>

    <div id="status" class="status">Ready</div>
    <audio id="audio-player" controls></audio>
    <div id="log" class="log hidden"></div>
  </div>
</div>

<script>
let currentMode = 'http';
let abortController = null;
let isGenerating = false;
let lastWavBlob = null;

// PCM config: 24kHz, int16, mono
const PCM_SAMPLE_RATE = 24000;

// ── Realtime PCM Streaming Player ──
// Decodes int16 PCM chunks as they arrive and schedules them on a
// WebAudio AudioContext so playback starts as soon as enough data has
// buffered (PREBUFFER_SECONDS) and continues seamlessly.
//
// HTTP chunk boundaries don't align to PCM sample boundaries (int16 = 2
// bytes/sample), so we maintain a rolling byte buffer and carry over any
// orphan byte to the next scheduling pass — otherwise the following
// chunk would start mid-sample and produce crackle/noise.
//
// Raw PCM bytes are also retained so the final audio can be exported as
// a WAV blob for replay/download.
class StreamingPCMPlayer {
  static PREBUFFER_SECONDS = 0.3;
  // Schedule in chunks of at least this many samples once playback is
  // live, to avoid the overhead of many tiny AudioBufferSourceNodes.
  static MIN_SCHEDULE_SECONDS = 0.02;

  constructor(sampleRate) {
    this.sampleRate = sampleRate;
    this.minScheduleSamples = Math.floor(sampleRate * StreamingPCMPlayer.MIN_SCHEDULE_SECONDS);

    // Keep raw PCM bytes for toWavBlob()
    this.allChunks = [];
    this.totalBytes = 0;
    this.totalSamples = 0;

    // Rolling byte buffer holding PCM data not yet scheduled.
    // Handles both (a) sample-boundary carry-over and (b) accumulation
    // up to prebuffer/min-schedule thresholds.
    this.pending = new Uint8Array(0);

    // WebAudio state
    this.audioCtx = null;
    this.gainNode = null;
    this.nextStartTime = 0;
    this.activeSources = new Set();

    this.prebuffering = true;
    this.stopped = false;
  }

  _ensureContext() {
    if (this.audioCtx) return;
    const Ctor = window.AudioContext || window.webkitAudioContext;
    this.audioCtx = new Ctor({ sampleRate: this.sampleRate });
    this.gainNode = this.audioCtx.createGain();
    this.gainNode.connect(this.audioCtx.destination);
    this.nextStartTime = this.audioCtx.currentTime;
  }

  _appendPending(chunk) {
    if (chunk.byteLength === 0) return;
    const merged = new Uint8Array(this.pending.byteLength + chunk.byteLength);
    merged.set(this.pending, 0);
    merged.set(chunk, this.pending.byteLength);
    this.pending = merged;
  }

  // Schedule as many whole samples as possible from `this.pending`, and
  // keep the orphan byte (if byteLength is odd) for the next pass.
  _scheduleFromPending() {
    const usableLen = this.pending.byteLength & ~1;  // floor to even
    if (usableLen === 0) return;

    // Copy out the even-byte prefix so int16 view has byteOffset=0 and
    // the backing buffer won't change underneath us.
    const pcm = this.pending.slice(0, usableLen);
    this.pending = this.pending.slice(usableLen);  // carry-over byte (0 or 1)

    const int16 = new Int16Array(pcm.buffer, 0, usableLen / 2);
    const float32 = new Float32Array(int16.length);
    for (let i = 0; i < int16.length; i++) {
      float32[i] = int16[i] / 32768;
    }

    const buffer = this.audioCtx.createBuffer(1, float32.length, this.sampleRate);
    buffer.copyToChannel(float32, 0);

    const source = this.audioCtx.createBufferSource();
    source.buffer = buffer;
    source.connect(this.gainNode);

    const startTime = Math.max(this.audioCtx.currentTime, this.nextStartTime);
    source.start(startTime);
    this.nextStartTime = startTime + buffer.duration;

    this.activeSources.add(source);
    source.onended = () => this.activeSources.delete(source);
  }

  feed(pcmBytes) {
    if (this.stopped) return;
    const chunk = new Uint8Array(pcmBytes);
    if (chunk.byteLength === 0) return;

    this.allChunks.push(chunk);
    this.totalBytes += chunk.byteLength;
    this.totalSamples = Math.floor(this.totalBytes / 2);

    this._ensureContext();
    this._appendPending(chunk);

    const pendingSamples = this.pending.byteLength >> 1;

    if (this.prebuffering) {
      const threshold = StreamingPCMPlayer.PREBUFFER_SECONDS * this.sampleRate;
      if (pendingSamples >= threshold) {
        this.prebuffering = false;
        this._scheduleFromPending();
      }
    } else if (pendingSamples >= this.minScheduleSamples) {
      this._scheduleFromPending();
    }
  }

  // End of stream — schedule whatever remains, even if below thresholds.
  // An orphan single byte at the very end is dropped (can't form a sample).
  flush() {
    if (this.stopped || !this.audioCtx) return;
    this.prebuffering = false;
    if (this.pending.byteLength >= 2) {
      this._scheduleFromPending();
    }
  }

  stop() {
    this.stopped = true;
    for (const source of this.activeSources) {
      try { source.stop(); } catch (_) { /* already stopped */ }
    }
    this.activeSources.clear();
    if (this.audioCtx) {
      this.audioCtx.close().catch(() => {});
      this.audioCtx = null;
      this.gainNode = null;
    }
  }

  toWavBlob() {
    const pcmData = concatArrayBuffers(this.allChunks);
    return pcmToWav(pcmData, this.sampleRate);
  }

  get durationSeconds() {
    return this.totalSamples / this.sampleRate;
  }
}

// Active streaming player (if any)
let streamingPlayer = null;

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active'));
  document.getElementById('mode-' + mode).classList.add('active');
}

function setStatus(text, type = '') {
  const el = document.getElementById('status');
  el.textContent = text;
  el.className = 'status' + (type ? ' ' + type : '');
}

function appendLog(text) {
  const el = document.getElementById('log');
  el.classList.remove('hidden');
  el.textContent += text + '\n';
  el.scrollTop = el.scrollHeight;
}

function replay() {
  if (!lastWavBlob) return;
  const player = document.getElementById('audio-player');
  player.src = URL.createObjectURL(lastWavBlob);
  player.play().catch(() => {});
}

function clearAll() {
  stopGeneration();
  lastWavBlob = null;
  document.getElementById('btn-replay').classList.add('hidden');
  document.getElementById('audio-player').src = '';
  document.getElementById('log').textContent = '';
  document.getElementById('log').classList.add('hidden');
  setStatus('Ready');
}

// Update UI when task type changes — show only relevant fields
function updateTaskTypeUI() {
  const taskType = document.getElementById('task-type').value;
  document.getElementById('customvoice-fields').classList.toggle('hidden', taskType !== 'CustomVoice');
  document.getElementById('voicedesign-fields').classList.toggle('hidden', taskType !== 'VoiceDesign');
  document.getElementById('base-fields').classList.toggle('hidden', taskType !== 'Base');
}
document.getElementById('task-type').addEventListener('change', updateTaskTypeUI);

// Fetch backend status on load
async function fetchBackends() {
  try {
    const resp = await fetch('/api/backends');
    const data = await resp.json();
    const parts = [];
    for (const [tt, info] of Object.entries(data)) {
      const icon = info.ready ? '\u2705' : '\u23F3';
      parts.push(`${icon} ${tt}`);
    }
    if (parts.length > 0) {
      document.querySelector('.subtitle').textContent = parts.join('  |  ');
    }
  } catch (e) { /* ignore */ }
}
fetchBackends();

// Fetch available voices on load (retries while backend is loading)
async function fetchVoices() {
  try {
    const resp = await fetch('/api/voices');
    const data = await resp.json();
    if (data.loading) {
      // Backend still loading - show status and retry
      setStatus('Backend loading... voices will appear when ready.');
      setTimeout(fetchVoices, 5000);
      return;
    }
    if (data.voices && data.voices.length > 0) {
      const select = document.getElementById('voice');
      select.innerHTML = '';
      const defaultVoice = 'sohee';
      data.voices.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v;
        if (v === defaultVoice) opt.selected = true;
        select.appendChild(opt);
      });
      setStatus('Ready');
    }
  } catch (e) {
    console.warn('Could not fetch voices:', e);
    setTimeout(fetchVoices, 5000);
  }
}
fetchVoices();

// Read a File into a base64 `data:` URL that the backend's
// _validate_ref_audio_format() accepts as ref_audio.
function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('File read failed'));
    reader.readAsDataURL(file);
  });
}

async function buildPayload() {
  const text = document.getElementById('text-input').value.trim();
  if (!text) { setStatus('Please enter text', 'error'); return null; }

  const taskType = document.getElementById('task-type').value;
  const payload = {
    input: text,
    task_type: taskType,
    language: document.getElementById('language').value,
  };

  if (taskType === 'CustomVoice') {
    payload.voice = document.getElementById('voice').value;
    const instructions = document.getElementById('instructions').value.trim();
    if (instructions) payload.instructions = instructions;

  } else if (taskType === 'VoiceDesign') {
    const desc = document.getElementById('voice-description').value.trim();
    if (!desc) { setStatus('Voice description is required for VoiceDesign', 'error'); return null; }
    payload.instructions = desc;

  } else if (taskType === 'Base') {
    // File upload takes priority over URL. One of the two must be provided.
    const fileInput = document.getElementById('ref-audio-file');
    const refUrl = document.getElementById('ref-audio-url').value.trim();
    const file = fileInput && fileInput.files && fileInput.files[0];

    if (file) {
      setStatus(`Reading ${file.name} (${(file.size / 1024).toFixed(1)} KB) ...`);
      try {
        payload.ref_audio = await fileToDataURL(file);
      } catch (e) {
        setStatus(`Failed to read file: ${e.message}`, 'error');
        return null;
      }
    } else if (refUrl) {
      payload.ref_audio = refUrl;
    } else {
      setStatus('Reference audio file or URL is required for Base (Voice Clone)', 'error');
      return null;
    }

    const refText = document.getElementById('ref-text').value.trim();
    if (refText) payload.ref_text = refText;
  }

  return payload;
}

// Show selected file name/size under the file input.
document.getElementById('ref-audio-file').addEventListener('change', (e) => {
  const info = document.getElementById('ref-audio-file-info');
  const file = e.target.files && e.target.files[0];
  if (file) {
    info.textContent = `Selected: ${file.name} (${(file.size / 1024).toFixed(1)} KB, ${file.type || 'audio'})`;
  } else {
    info.textContent = '';
  }
});

function setGenerating(state) {
  isGenerating = state;
  document.getElementById('btn-generate').disabled = state;
  document.getElementById('btn-generate').classList.toggle('hidden', state);
  document.getElementById('btn-stop').classList.toggle('hidden', !state);
}

function stopGeneration() {
  if (abortController) { abortController.abort(); abortController = null; }
  if (streamingPlayer) { streamingPlayer.stop(); streamingPlayer = null; }
  setGenerating(false);
}

async function generate() {
  const payload = await buildPayload();
  if (!payload) return;

  document.getElementById('log').textContent = '';
  setGenerating(true);

  try {
    if (currentMode === 'http') {
      await generateHTTPStream(payload);
    } else {
      await generateFull(payload);
    }
  } catch (e) {
    if (e.name !== 'AbortError') {
      setStatus('Error: ' + e.message, 'error');
      appendLog('ERROR: ' + e.message);
    }
  } finally {
    setGenerating(false);
  }
}

// ── HTTP Streaming (realtime playback) ──

// Try to extract JSON metadata trailer from the final chunk.
// The server appends 4 zero-bytes + JSON after all PCM data.
function extractTrailer(chunk) {
  // Search for the 4-zero-byte magic marker from the end
  // (scan backwards — trailer is always at the tail of the last chunk)
  const MAGIC = [0, 0, 0, 0];
  for (let i = chunk.length - 1; i >= 4; i--) {
    if (chunk[i - 3] === 0 && chunk[i - 2] === 0 && chunk[i - 1] === 0 && chunk[i] === 0) {
      // Potential marker at i-3..i — try to parse what follows as JSON
      const jsonStart = i + 1;
      if (jsonStart >= chunk.length) continue;
      try {
        const text = new TextDecoder().decode(chunk.slice(jsonStart));
        const meta = JSON.parse(text);
        if (meta._tts_meta) {
          // Return PCM portion (before marker) and parsed metadata
          const pcmPart = chunk.slice(0, i - 3);
          return { pcm: pcmPart, meta };
        }
      } catch {
        // Not valid JSON at this position — keep scanning
      }
    }
  }
  return null;
}

async function generateHTTPStream(payload) {
  setStatus('Streaming audio (HTTP)...');
  abortController = new AbortController();

  // Clean up previous state
  document.getElementById('audio-player').src = '';
  if (streamingPlayer) { streamingPlayer.stop(); streamingPlayer = null; }

  const startTime = performance.now();
  let totalBytes = 0;
  let firstChunkTime = null;
  let serverMeta = null;

  // Create streaming player — plays chunks as they arrive
  streamingPlayer = new StreamingPCMPlayer(PCM_SAMPLE_RATE);

  const resp = await fetch('/api/tts/stream', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    signal: abortController.signal,
  });

  if (!resp.ok) {
    throw new Error(`Server returned ${resp.status}`);
  }

  const reader = resp.body.getReader();
  let prevChunk = null;

  while (true) {
    const { done, value } = await reader.read();

    // Feed the *previous* chunk — we hold one chunk back so we can
    // inspect the very last chunk for a metadata trailer before feeding it.
    if (prevChunk) {
      if (done) {
        // prevChunk is the final chunk — check for trailer
        const result = extractTrailer(prevChunk);
        if (result) {
          serverMeta = result.meta;
          if (result.pcm.length > 0) {
            streamingPlayer.feed(result.pcm);
            totalBytes += result.pcm.length;
          }
        } else {
          streamingPlayer.feed(prevChunk);
          totalBytes += prevChunk.length;
        }
      } else {
        // Not the last chunk — feed normally
        streamingPlayer.feed(prevChunk);
        totalBytes += prevChunk.length;
      }
      const duration = streamingPlayer.durationSeconds;
      const statusExtra = streamingPlayer.prebuffering ? ' (buffering...)' : '';
      setStatus(`Streaming... ${(totalBytes / 1024).toFixed(1)} KB, ${duration.toFixed(1)}s audio${statusExtra}`);
    }

    if (done) break;

    if (!firstChunkTime) {
      firstChunkTime = performance.now();
      appendLog(`First chunk latency: ${(firstChunkTime - startTime).toFixed(0)}ms`);
      appendLog(`Pre-buffering ${StreamingPCMPlayer.PREBUFFER_SECONDS}s before playback...`);
    }

    prevChunk = value;
  }

  // Flush any remaining buffered audio
  streamingPlayer.flush();

  const elapsed = performance.now() - startTime;
  const duration = streamingPlayer.durationSeconds;

  // Client-side RTF
  const clientRtf = duration > 0 ? (elapsed / 1000) / duration : 0;

  appendLog(`── Client metrics ──`);
  appendLog(`Audio duration: ${duration.toFixed(2)}s`);
  appendLog(`Total elapsed: ${(elapsed / 1000).toFixed(2)}s`);
  appendLog(`Client RTF: ${clientRtf.toFixed(4)}`);
  appendLog(`Total: ${(totalBytes / 1024).toFixed(1)} KB`);

  if (serverMeta) {
    appendLog(`── Server metrics ──`);
    appendLog(`Audio duration: ${serverMeta.audio_duration}s`);
    appendLog(`Processing time: ${serverMeta.processing_time}s`);
    appendLog(`TTFB: ${serverMeta.ttfb}s`);
    appendLog(`Server RTF: ${serverMeta.rtf}`);
  }

  const rtfDisplay = serverMeta ? serverMeta.rtf : clientRtf.toFixed(4);

  setStatus(`Done! ${duration.toFixed(1)}s audio, RTF=${rtfDisplay}`, 'success');

  // Realtime playback already happened via Web Audio API during the
  // stream. Load the final WAV into the <audio> element only so that
  // the user can replay/seek — do not auto-play (would double-play).
  lastWavBlob = streamingPlayer.toWavBlob();
  document.getElementById('btn-replay').classList.remove('hidden');
  setAudioPlayerBlob(lastWavBlob);
  // Keep the streamingPlayer reference so post-stream audio tails can be
  // stopped by the cleanup block on the next Generate/Stop/Clear click.
}

// ── Full (Non-streaming) ──
async function generateFull(payload) {
  setStatus('Generating audio (non-streaming)...');
  abortController = new AbortController();

  // Clean up previous state
  document.getElementById('audio-player').src = '';
  if (streamingPlayer) { streamingPlayer.stop(); streamingPlayer = null; }

  const startTime = performance.now();

  payload.response_format = 'wav';

  const resp = await fetch('/api/tts/full', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
    signal: abortController.signal,
  });

  if (!resp.ok) throw new Error(`Server returned ${resp.status}`);

  const rtf = resp.headers.get('X-RTF');
  const audioDuration = resp.headers.get('X-Audio-Duration');
  const processingTime = resp.headers.get('X-Processing-Time');

  const blob = await resp.blob();
  const elapsed = performance.now() - startTime;

  // Non-streaming: safe to play immediately via <audio> (no Web Audio conflict)
  lastWavBlob = blob;
  playAudioBlob(blob);
  document.getElementById('btn-replay').classList.remove('hidden');

  if (rtf && audioDuration) {
    appendLog(`Audio duration: ${parseFloat(audioDuration).toFixed(2)}s`);
    appendLog(`Processing time: ${parseFloat(processingTime).toFixed(2)}s`);
    appendLog(`RTF: ${parseFloat(rtf).toFixed(4)} (lower is better, <1.0 = faster than realtime)`);
    appendLog(`Total: ${(blob.size / 1024).toFixed(1)} KB`);
    setStatus(`Done! ${parseFloat(audioDuration).toFixed(1)}s audio, RTF=${parseFloat(rtf).toFixed(4)}`, 'success');
  } else {
    appendLog(`Total: ${(blob.size / 1024).toFixed(1)} KB in ${(elapsed / 1000).toFixed(2)}s`);
    setStatus(`Done! ${(blob.size / 1024).toFixed(1)} KB, ${(elapsed / 1000).toFixed(2)}s`, 'success');
  }
}

// ── Audio Utilities ──
function concatArrayBuffers(arrays) {
  let totalLen = 0;
  arrays.forEach(a => totalLen += a.length);
  const result = new Uint8Array(totalLen);
  let offset = 0;
  arrays.forEach(a => { result.set(a, offset); offset += a.length; });
  return result;
}

function pcmToWav(pcmData, sampleRate) {
  const buffer = new ArrayBuffer(44 + pcmData.length);
  const view = new DataView(buffer);

  const writeString = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + pcmData.length, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);           // PCM format
  view.setUint16(22, 1, true);           // mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);           // block align
  view.setUint16(34, 16, true);          // bits per sample
  writeString(36, 'data');
  view.setUint32(40, pcmData.length, true);

  new Uint8Array(buffer, 44).set(pcmData);
  return new Blob([buffer], { type: 'audio/wav' });
}

// Set WAV blob on <audio> element for replay/seek (does NOT auto-play)
function setAudioPlayerBlob(blob) {
  const url = URL.createObjectURL(blob);
  const player = document.getElementById('audio-player');
  player.src = url;
}

// Play blob immediately via <audio> element (used for non-streaming mode)
function playAudioBlob(blob) {
  const url = URL.createObjectURL(blob);
  const player = document.getElementById('audio-player');
  player.src = url;
  player.play().catch(() => {});
}
